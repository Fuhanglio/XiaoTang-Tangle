apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'

apply plugin: 'kotlin-kapt'

apply plugin: "androidx.navigation.safeargs.kotlin"

configurations.all {
    // referenced in some portable lib. use android internal instead
    exclude group: 'commons-logging'
}

// 项目内固定的调试签名密钥。
//
// 为什么要有这个：Android 只允许**同包名 + 同签名 + versionCode 不降级**的 APK 覆盖安装。
// 默认调试签名取自 %USERPROFILE%\.android\debug.keystore，那个文件一旦被清理工具删掉、
// 或者换了机器/重装了系统，就会重新生成一份**不同的证书**，编出来的包和手机上已装的包签名
// 对不上，安装时只能先卸载——卸载会清掉全部课表数据。
//
// 把密钥随项目保存（放 keystore/ 目录，已在 .gitignore 里，不会提交到公开仓库），
// 每次编译都从同一份证书签，就能一直覆盖安装、数据不丢。
// 该文件不存在时（例如从 GitHub clone 下来但没有这个密钥）自动退回系统默认调试签名，
// 编译不会失败，只是签出来的包和已有安装对不上而已。
def fixedDebugKeyStore = rootProject.file('keystore/xiaotang.jks')

android {
    // AGP 8 起，AndroidManifest 的 package 属性不再支持，改由 namespace 指定（R 类包名）。
    namespace 'com.Tangle.timetable'
    signingConfigs {
        config {
            keyAlias 'yzune'
            keyPassword '11166511'
            storeFile file('/Volumes/Document/yzune.jks')
            storePassword '11166511'
        }
        if (fixedDebugKeyStore.exists()) {
            xiaotang {
                storeFile fixedDebugKeyStore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions "versionCode"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        // 规则：此后每次修改应用，versionCode +1，versionName 最后一位 +1。
        versionCode 141
        versionName "3.672"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        ndk {
            // 选择要添加的对应cpu类型的.so库。
            abiFilters 'armeabi-v7a', "arm64-v8a", "x86"
        }
    }
    buildTypes {
        debug {
            // 用项目内固定的密钥签名，保证每次编出来的包都能覆盖安装到已装版本上
            if (fixedDebugKeyStore.exists()) {
                signingConfig signingConfigs.xiaotang
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFile 'proguard-android.txt'
            proguardFile 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    buildToolsVersion '34.0.0'

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/library_release.kotlin_module',
                         'META-INF/DEPENDENCIES.txt',
                         'META-INF/LICENSE.txt',
                         'META-INF/NOTICE.txt',
                         'META-INF/NOTICE',
                         'META-INF/LICENSE',
                         'META-INF/DEPENDENCIES',
                         'META-INF/notice.txt',
                         'META-INF/license.txt',
                         'META-INF/dependencies.txt',
                         'META-INF/LGPL2.1',
                         'META-INF/ASL2.0',
                         'org/apache/commons/codec/language/bm/*.txt',
                         'lib/*/libRSSupport.so',
                         'lib/*/librsjni.so',
                         'lib/*/librsjni_androidx.so']
        }
    }

    productFlavors {
        google {
            applicationId "com.Tangle.timetable.pro"
            resValue "string", "app_name", "小唐Tangle课程表Pro"
            //AndroidManifest.xml中定义的meta-data标签,
            //需要和meta-data中的android:value="${CHANNEL}对应
            manifestPlaceholders = [CHANNEL: "google"]
        }
        huawei {
            applicationId "com.Tangle.timetable"
            resValue "string", "app_name", "小唐Tangle课程表"
            //AndroidManifest.xml中定义的meta-data标签,
            //需要和meta-data中的android:value="${CHANNEL}对应
            manifestPlaceholders = [CHANNEL: "huawei"]
        }
        normal {
            applicationId "com.Tangle.timetable"
            resValue "string", "app_name", "小唐Tangle课程表"
            manifestPlaceholders = [CHANNEL: "normal"]
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    def lifecycle_version = "2.2.0"
    def room_version = "2.6.1"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.3"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.android.material:material:1.9.0'
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    // WorkManager 2.3.4（2020）内部用 PendingIntent 时无可变性标志，targetSdk31+ 会崩，升到 2.9.0
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation 'com.squareup.retrofit2:retrofit:2.7.1'
    implementation 'com.github.GrenderG:Toasty:1.4.2'
    implementation 'org.jsoup:jsoup:1.12.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'cn.carbswang.android:NumberPickerView:1.2.0'
    implementation('com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.0-beta11') {
        exclude group: 'androidx'
    }
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    kapt 'com.github.bumptech.glide:compiler:4.11.0'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation 'com.github.doyaaaaaken:kotlin-csv-jvm:0.7.3'
    implementation 'com.github.jahirfiquitiva:TextDrawable:1.0.3'
    implementation 'com.bigkoo:quicksidebar:1.0.3'
    implementation 'com.timehop.stickyheadersrecyclerview:library:0.4.3@aar'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation('net.sf.biweekly:biweekly:0.6.3') {
        exclude module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation 'com.github.sephiroth74:android-target-tooltip:2.0.4'
    // 图片导入课表：本地离线 OCR（Tesseract 5.x + 简体中文训练数据）。
    // 全部识别在本机完成，不联网、不上传图片；训练数据在 assets/tessdata 下，首次运行时释放到私有目录。
    //
    // 为什么不用 Maven 坐标（cz.adaptech.tesseract4android:tesseract4android:4.8.0）：
    // 官方 4.8.0 的 AAR 里 class 文件是 Java 17 字节码（major 61），而本项目早期 AGP（2019 年）
    // 只认到 Java 8（major 52），Jetifier 转换该 AAR 时会直接崩溃
    // （Failed to transform ... using Jetifier. Reason: null），blacklist 也绕不过（失败发生在
    // processed-jar 阶段）。该库源码只用 Java 8 级 API，所以改用 JDK 8 重编译了它的源码，
    // 产物为 app/libs/tesseract4android-4.8.0-jdk8.jar（42 个类，major 52），
    // native 库原样取自官方 AAR 的 jni/ 目录，放在 app/src/main/jniLibs/ 下。
    // jar 由上面的 fileTree(include: ['*.jar'], dir: 'libs') 自动引入，无需单独声明。
    // 注意：该 jar 为 Java 8 字节码，在 JDK 17 工具链下依然可用。
}
