apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'

apply plugin: 'kotlin-kapt'

apply plugin: "androidx.navigation.safeargs.kotlin"

configurations.all {
    // referenced in some portable lib. use android internal instead
    exclude group: 'commons-logging'
}

// 项目内固定的调试签名密钥。
//
// 为什么要有这个：Android 只允许**同包名 + 同签名 + versionCode 不降级**的 APK 覆盖安装。
// 默认调试签名取自 %USERPROFILE%\.android\debug.keystore，那个文件一旦被清理工具删掉、
// 或者换了机器/重装了系统，就会重新生成一份**不同的证书**，编出来的包和手机上已装的包签名
// 对不上，安装时只能先卸载——卸载会清掉全部课表数据。
//
// 把密钥随项目保存（放 keystore/ 目录，已在 .gitignore 里，不会提交到公开仓库），
// 每次编译都从同一份证书签，就能一直覆盖安装、数据不丢。
// 该文件不存在时（例如从 GitHub clone 下来但没有这个密钥）自动退回系统默认调试签名，
// 编译不会失败，只是签出来的包和已有安装对不上而已。
def fixedDebugKeyStore = rootProject.file('keystore/xiaotang.jks')

android {
    // AGP 8 起，AndroidManifest 的 package 属性不再支持，改由 namespace 指定（R 类包名）。
    namespace 'com.Tangle.timetable'
    // W4-01 / W4-02：release 签名配置改为**从 keystore.properties 读取**（该文件已在 .gitignore）。
    //
    // 改之前的问题（两处，都是"配置本身是坏的"而不只是"没授权"）：
    //   ① 口令明文写在**被 git 跟踪的** build.gradle 里 —— 该值已随仓库公开（等于已泄露）；
    //   ② storeFile 用的是原作者 macOS 上的绝对路径 `/Volumes/Document/yzune.jks`，
    //      Groovy 的 file() 在模块目录下解析它 → 变成 `app/Volumes/Document/yzune.jks`
    //      → `validateSigningNormalRelease` **必然失败**，release 构建 100% 编不出来。
    //
    // 现在：
    //   · 口令/别名/路径全部读本地 `keystore.properties`（不进仓库），换口令只需改一个文件；
    //   · 文件缺失或未填口令时**不注册 release 签名配置**，release 会产出**未签名** APK
    //     —— R8、资源收缩、打包全部照常跑通，只是还不能直接装。
    //   · 也**不再沿用那个已泄露的旧口令**：请填你自己的新口令，并给 keystore 换口令。
    //
    // keystore.properties 的格式（键名固定，缺失即视为未配置）：
    //   release.storeFile=keystore/yzune.jks        # 相对**项目根目录**
    //   release.storePassword=你的store口令
    //   release.keyAlias=yzune
    //   release.keyPassword=你的key口令
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def releaseStorePath = keystoreProps.getProperty('release.storeFile', '')
    def releaseStorePassword = keystoreProps.getProperty('release.storePassword', '')
    def releaseKeyPassword = keystoreProps.getProperty('release.keyPassword', '')
    def releaseKeyAlias = keystoreProps.getProperty('release.keyAlias', '')
    def releaseSigningReady = releaseStorePath &&
            releaseStorePassword && releaseKeyPassword && releaseKeyAlias &&
            rootProject.file(releaseStorePath).exists()

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        if (fixedDebugKeyStore.exists()) {
            xiaotang {
                storeFile fixedDebugKeyStore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions "versionCode"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        // 规则：此后每次修改应用，versionCode +1，versionName 最后一位 +1。
        versionCode 166
        versionName "3.697"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        ndk {
            // 选择要添加的对应cpu类型的.so库。
            // W4-05：原为 'armeabi-v7a', "arm64-v8a", "x86" —— 但 jniLibs/ 下只有
            // armeabi-v7a 与 arm64-v8a 两个目录（v122 引入 OCR 时只搬了上游 AAR 的这两个 ABI），
            // 已产出的 APK 里也只有这两个 ABI → 声明与实际交付脱节。
            // 台账给了两条路：(a) 从官方 AAR 补齐 x86/x86_64 各 4 个 .so（体积 +≈15MB）；
            // (b) 让声明与交付一致。本批选 (b)：不虚增 15MB 包体，x86/x86_64 设备上的
            // 「图片导入课表」（Tesseract OCR）本来就没有原生库可用，与改前行为一致。
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            // 用项目内固定的密钥签名，保证每次编出来的包都能覆盖安装到已装版本上
            if (fixedDebugKeyStore.exists()) {
                signingConfig signingConfigs.xiaotang
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            // W4-14：原来这里写着 `zipAlignEnabled true` —— 该选项从 AGP 3.x 起就已被
            // **无条件启用**（zipalign 是打包必经步骤），显式写成一行不仅无效，
            // 还会让人误以为"关掉它就能不 zipalign"。已删。
            proguardFile 'proguard-android.txt'
            proguardFile 'proguard-rules.pro'
            // W4-01：只有 keystore.properties 里四项齐备且密钥文件真实存在时才挂签名配置；
            // 否则产出**未签名** APK（R8 / 资源收缩 / 打包照常，release 链路因此可被验证）
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildToolsVersion '34.0.0'

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/library_release.kotlin_module',
                         'META-INF/DEPENDENCIES.txt',
                         'META-INF/LICENSE.txt',
                         'META-INF/NOTICE.txt',
                         'META-INF/NOTICE',
                         'META-INF/LICENSE',
                         'META-INF/DEPENDENCIES',
                         'META-INF/notice.txt',
                         'META-INF/license.txt',
                         'META-INF/dependencies.txt',
                         'META-INF/LGPL2.1',
                         'META-INF/ASL2.0',
                         // W4-08：原此处排除 'org/apache/commons/codec/language/bm/*.txt'，
                         // 但本工程从未依赖 commons-codec（build.gradle 里无命中）→ 该排除项无对应物，
                         // 属从旧模板沿用的漂移配置，已删。
                         'lib/*/libRSSupport.so',
                         'lib/*/librsjni.so',
                         'lib/*/librsjni_androidx.so']
        }
    }

    productFlavors {
        google {
            applicationId "com.Tangle.timetable.pro"
            resValue "string", "app_name", "小唐Tangle课程表Pro"
            //AndroidManifest.xml中定义的meta-data标签,
            //需要和meta-data中的android:value="${CHANNEL}对应
            manifestPlaceholders = [CHANNEL: "google"]
        }
        huawei {
            applicationId "com.Tangle.timetable"
            resValue "string", "app_name", "小唐Tangle课程表"
            //AndroidManifest.xml中定义的meta-data标签,
            //需要和meta-data中的android:value="${CHANNEL}对应
            manifestPlaceholders = [CHANNEL: "huawei"]
        }
        normal {
            applicationId "com.Tangle.timetable"
            resValue "string", "app_name", "小唐Tangle课程表"
            manifestPlaceholders = [CHANNEL: "normal"]
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // W4-11：原为 "2.2.0"（2020 年）。工程实际早已在用 2.4+ 才有的
    // `lifecycleScope` / `viewLifecycleOwner.lifecycleScope`，真实生效版本是传递依赖顶上来的。
    // 显式对齐到 2.6.2：与缓存中实际存在的构件版本一致，不再依赖"恰好被谁带上来"。
    def lifecycle_version = "2.6.2"
    def room_version = "2.6.1"

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation "androidx.appcompat:appcompat:1.6.1"
    // W4-11：这里原本写 1.3.3，但工程实际一直在用 1.7.1 的 API（`awaitAll` / `CoroutineScope`
    // 扩展等），真正生效的版本由其它依赖传递上来 —— 声明与实际**长期不一致**。
    // 现在显式对齐到实际使用的 1.7.1（行为不变，只是把"暗箱"写明白）。
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.google.android.material:material:1.9.0'
    // W4-12：`lifecycle-extensions` 自 **2.2.0 起已停止发布**（整体被拆成各子构件），
    // 且它的所有能力都已由下面的显式构件覆盖（工程里未使用 `ProcessLifecycleOwner`）。
    // 拆开声明后：① 版本可独立演进；② 不会再把整套 livedata/viewmodel 隐式拖进来；
    // ③ `lifecycle-runtime-ktx` 正是 `lifecycleScope` / `viewLifecycleOwner.lifecycleScope`
    //    的来源 —— 以前是靠传递依赖"恰好"拿到的，现在写明。
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    // WorkManager 2.3.4（2020）内部用 PendingIntent 时无可变性标志，targetSdk31+ 会崩，升到 2.9.0
    implementation "androidx.work:work-runtime:2.9.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation 'com.squareup.retrofit2:retrofit:2.7.1'
    // R2-01：okhttp 3.14.4（2020）的 Android 平台探测在 SDK 36 上会落到异常分支，
    // 而 OkHttpClient 在 UpdateClient.<clinit> 里创建 → ExceptionInInitializerError(Error)
    // → catch (Exception) 接不住 → 每次进程启动（含小部件广播拉起）必崩。
    // 本工程此前**没有声明 okhttp**，用的是 retrofit:2.7.1 传递带进来的 3.14.4，故显式声明覆盖之。
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.GrenderG:Toasty:1.4.2'
    // W4-03：1.12.2 存在 CVE-2021-37714（解析恶意 HTML 可致无限循环/异常 → DoS，CVSS 7.5，
    // 1.14.2 修复）。触发面很实在：HTML 导入直接解析教务系统网页，而 .html 是 exported 入口，
    // 任意应用都能把构造的 HTML 交给本应用。升到 1.17.2（>1.14.2，同时覆盖 1.15.3 修复的 XXE 类问题）。
    // 代码侧只用了 Jsoup.connect / Jsoup.parse / getElementById / getElementsByTag /
    // getElementsByAttributeValue / select，这些在 1.12→1.17 之间 API 稳定。
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'cn.carbswang.android:NumberPickerView:1.2.0'
    implementation('com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.0-beta11') {
        exclude group: 'androidx'
    }
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    // W4-04：2.8.6 存在 CVE-2022-25647（writeReplace() 反序列化不可信数据 → DoS，7.5/7.7，
    // 2.8.9 修复）。触发面同样实在：.wakeup_schedule / CSV / JSON 导入文件都来自 exported VIEW 入口，
    // 以及学校教务服务器返回的 JSON。升到 2.9.0（≥2.8.9）。-keepattributes Signature 与 bean keep 规则不受影响。
    implementation 'com.google.code.gson:gson:2.9.0'
    // W4-14：原来的 `kapt 'com.github.bumptech.glide:compiler:4.11.0'` 已删。
    // 它的作用只有一个：注解处理生成 `GlideApp` / `GeneratedAppGlideModuleImpl`。
    // 已全工程 grep 确认：`GlideApp`、`GeneratedAppGlideModule`、`@GlideModule`、
    // `AppGlideModule` **一个引用点都没有** —— 全部走的是普通 `Glide.with(...)`，
    // 所以这段注解处理纯属空跑（拖慢构建、还多一份生成物）。
    // ⚠ 若将来要自定义 Glide 配置（如全局缓存策略），再把它加回来并改用 `GlideApp.with(...)`。
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation 'com.github.doyaaaaaken:kotlin-csv-jvm:0.7.3'
    implementation 'com.github.jahirfiquitiva:TextDrawable:1.0.3'
    implementation 'com.bigkoo:quicksidebar:1.0.3'
    implementation 'com.timehop.stickyheadersrecyclerview:library:0.4.3@aar'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation('net.sf.biweekly:biweekly:0.6.3') {
        exclude module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation 'com.github.sephiroth74:android-target-tooltip:2.0.4'
    // 图片导入课表：本地离线 OCR（Tesseract 5.x + 简体中文训练数据）。
    // 全部识别在本机完成，不联网、不上传图片；训练数据在 assets/tessdata 下，首次运行时释放到私有目录。
    //
    // 为什么不用 Maven 坐标（cz.adaptech.tesseract4android:tesseract4android:4.8.0）：
    // 官方 4.8.0 的 AAR 里 class 文件是 Java 17 字节码（major 61），而本项目早期 AGP（2019 年）
    // 只认到 Java 8（major 52），Jetifier 转换该 AAR 时会直接崩溃
    // （Failed to transform ... using Jetifier. Reason: null），blacklist 也绕不过（失败发生在
    // processed-jar 阶段）。该库源码只用 Java 8 级 API，所以改用 JDK 8 重编译了它的源码，
    // 产物为 app/libs/tesseract4android-4.8.0-jdk8.jar（42 个类，major 52），
    // native 库原样取自官方 AAR 的 jni/ 目录，放在 app/src/main/jniLibs/ 下。
    // jar 由上面的 fileTree(include: ['*.jar'], dir: 'libs') 自动引入，无需单独声明。
    // 注意：该 jar 为 Java 8 字节码，在 JDK 17 工具链下依然可用。
}
